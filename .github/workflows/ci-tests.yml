name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff (neue/strukturierte Module)
        run: |
          ruff check app/services app/background_jobs.py app/alert_count_cache.py \
            app/parallel_system_status.py app/models app/api/storage_clients \
            app/routes/main.py app/routes/api.py app/routes/admin \
            app/status_service.py

      - name: Run test suite
        env:
          SECRET_KEY: ci-test-secret-key-32bytes-minimum!!
          DATABASE_URL: sqlite://
          SSL_VERIFY: 'false'
        run: |
          python -m pytest tests/ -v --tb=short --cov=app --cov-config=.coveragerc --cov-report=term-missing
