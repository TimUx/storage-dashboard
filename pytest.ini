[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::sqlalchemy.exc.LegacyAPIWarning
addopts = -ra --strict-markers
markers =
    unit: Schnelle isolierte Unit-Tests (kein vollständiger App-Lifecycle).
    integration: HTTP-/DB-Integration mit Flask-Testclient.
    e2e: End-to-End User-Flows (mehrere Requests, realistische Reihenfolge).
    browser_e2e: Optionale Playwright-Browser-Tests (nicht in Standard-CI).
